x-app-user-build-args: &app-user-build-args
  APP_UID: 10001
  APP_GID: 10001

services:
  backend:
    build:
      context: .
      args: *app-user-build-args
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads
      - backend-output:/app/output
      - backend-data:/app/data
      - hf-cache:/app/.cache/huggingface
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./dashboard
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
      args: *app-user-build-args
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - backend-output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  backend-uploads:
  backend-output:
  backend-data:
  hf-cache:
